[project]
name = "artifactforge"
version = "0.6.0.dev0"
description = "Deterministic, parser-gated synthetic forensic artifacts with byte-derived identity."
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
# The generator is pure standard library — artifacts are hand-assembled, so nothing at
# runtime can silently introduce wall-clock non-determinism.
dependencies = []

[project.optional-dependencies]
# External DFIR parsers are dev-only CI oracles, never generation dependencies. The bounded
# raw readers ship in the zero-dependency package. Independent implementations cover every
# classified format because one permissive parser can hide what a strict one rejects.
#   PE        pefile + lief
#   Mach-O    lief + macholib
#   registry  regipy + libregf
#   Prefetch  legacy v17: windowsprefetch + libscca; current v30: libscca +
#             dissect.target semantics + the bounded first-party MAM/layout reader
#   SQLite    sqlite3 + the bounded first-party raw reader
#   bplist    plistlib + the bounded first-party raw reader
#   ELF       LIEF + pyelftools
#   XDG       PyXDG + the bounded first-party raw reader
#   Bash      dissect.target + the bounded first-party raw reader
#   Shell Link liblnk-python + LnkParse3, with the bounded first-party reader owning layout
dev = [
    "pytest>=8",
    # Execute the published Draft 2020-12 fixture schemas against every shipped v2 recipe
    # and freshly generated manifest; model-only cross-field equations remain explicit.
    "jsonschema>=4.23,<5",
    "pefile",
    "lief",
    "macholib",
    "yara-python",
    "regipy",
    "libregf-python",
    "windowsprefetch",
    # This exact libyal binding build defines the typed v17/v30 adapter contract. Keep parser
    # upgrades deliberate: a new build can change MAM or variant-layout acceptance.
    "libscca-python==20260527",
    # Exact pins define the public adapter contract. liblnk is a compiled LGPL parser loaded
    # dynamically as a dev-only oracle; LnkParse3 is MIT and pure Python. Neither is imported
    # by generation code or bundled into ArtifactForge distributions.
    "liblnk-python==20260525",
    "LnkParse3==1.6.0",
    # These versions define the Linux oracle adapter contract. PyXDG is used as a typed
    # parser only (its validator rejects modern DBusActivatable and overwrites duplicate
    # keys); the shipped reader owns the strict profile. Gate 1 reaches dissect.target through
    # its public Target plugin API, and the pin makes that adapter contract reproducible.
    "pyelftools==0.33",
    "PyXDG==0.28",
    "dissect.target==3.25.1",
    # Pin below 0.16: ruff 0.16 turns on new default lint rules that flag pre-existing code,
    # which breaks CI on an unpinned upgrade. Cap so CI is reproducible; bump deliberately
    # (and clear the new findings) when adopting 0.16+.
    "ruff>=0.6,<0.16",
]
# EvidenceForge is NOT declared here at any level, deliberately. It is not on PyPI, so it can
# only be named as a direct git URL — and hatchling refuses to build a wheel for a project
# carrying one, which would make this distribution un-uploadable. It is a CI-only contract
# tool, installed independently by the pinned-contract and default-branch canary jobs:
#   uv pip install "evidence-forge @ git+https://github.com/Cisco-Talos/EvidenceForge@v1.13.1"
# Note the distribution name is `evidence-forge`, not `evidenceforge`; the import name is
# `evidenceforge`. Getting this wrong makes the install step exit 1.

[project.scripts]
artifactforge = "artifactforge.cli:console_main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactforge"]
# integration/ holds controlled EvidenceForge witnesses and upstream contribution drafts. It is
# not part of the wheel package and must never be installed alongside it: it is the only place
# in the repository containing upstream patch prototypes, and those belong in review material,
# not a dependency. Source archives retain the review material deliberately.
# tests/test_isolation.py enforces the runtime boundary in the other direction.
exclude = ["integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
