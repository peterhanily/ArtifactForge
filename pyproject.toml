[project]
name = "artifactforge"
version = "0.0.1"
description = "Deterministic forensic-artifact companion to EvidenceForge: content-first identity so a file's hash agrees across logs, disk, and artifacts."
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
# The generator is pure standard library — artifacts are hand-assembled, so nothing at
# runtime can silently introduce wall-clock non-determinism.
dependencies = []

[project.optional-dependencies]
# Real DFIR parsers used only as CI oracles (consistency-by-construction), never to generate.
# Two independently-implemented parsers per format, because one permissive parser hides what
# a strict one rejects: every prefetch file this project emitted was accepted by
# `windowsprefetch` and refused by libyal's `pyscca` — which plaso is built on — for as long
# as `windowsprefetch` was the only oracle installed.
#   PE        pefile + lief
#   Mach-O    lief + macholib
#   registry  regipy + libregf
#   prefetch  windowsprefetch + libscca
dev = [
    "pytest>=8",
    "pefile",
    "lief",
    "macholib",
    "yara-python",
    "regipy",
    "libregf-python",
    "windowsprefetch",
    "libscca-python",
    # Pin below 0.16: ruff 0.16 turns on new default lint rules that flag pre-existing code,
    # which breaks CI on an unpinned upgrade. Cap so CI is reproducible; bump deliberately
    # (and clear the new findings) when adopting 0.16+.
    "ruff>=0.6,<0.16",
]
# EvidenceForge is NOT declared here at any level, deliberately. It is not on PyPI, so it can
# only be named as a direct git URL — and hatchling refuses to build a wheel for a project
# carrying one, which would make this distribution un-uploadable. It is a CI-only dev tool,
# installed by the ef-contract job:
#   uv pip install "evidence-forge @ git+https://github.com/Cisco-Talos/EvidenceForge@v1.13.1"
# Note the distribution name is `evidence-forge`, not `evidenceforge`; the import name is
# `evidenceforge`. Getting this wrong makes the install step exit 1.

[project.scripts]
artifactforge = "artifactforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactforge"]
# integration/ holds a sketch of a possible upstream contribution to EvidenceForge. It is not
# part of the package and must never be installed alongside it: it is the only place in the
# repository that patches upstream in process, and that belongs in a demonstration, not in a
# dependency. tests/test_isolation.py enforces the same boundary in the other direction.
exclude = ["integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
