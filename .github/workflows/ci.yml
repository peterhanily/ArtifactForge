name: CI

# Least privilege: this workflow only reads the tree and runs tests.
permissions:
  contents: read

# The gate is not just unit tests — it is real DFIR parsers (including LIEF, pyelftools,
# PyXDG, dissect.target, pefile, regipy and libscca) reading freshly generated artifacts, so
# "a responder's tools can read this" is checked on every change rather than asserted.
on:
  push:
  pull_request:

env:
  # Every project-backed uv command consumes the committed dependency closure. The
  # scorecard fingerprints uv.lock, so silently resolving a different oracle set here would
  # make that provenance claim false. CI-only EvidenceForge is installed explicitly after
  # this frozen project sync and remains outside the package metadata.
  UV_FROZEN: "1"
  # Bootstrap through an isolated venv so PEP 668 runner Python installations stay untouched.
  # Keep the installer version centralized and exact; every job verifies what it installed.
  UV_VERSION: "0.11.17"
  # Hatchling consumes this standard build timestamp. A fixed epoch makes release archives
  # independent of checkout/build time; the hashed build closure fixes the producer itself.
  SOURCE_DATE_EPOCH: "0"
  # One place to bump the pin. The seed formulas in artifactforge/ef_seeds.py are verified
  # against this exact tag, and tests/ef_contract/test_golden_formulas.py compares them to
  # upstream's own code on every run.
  EF_TAG: v1.13.1

jobs:
  # ArtifactForge is standalone. This job installs NO EvidenceForge on purpose: if the suite
  # cannot go green without it, the standalone claim is false.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]   # 3.11 is the declared floor — test it, don't assume it
    steps:
      - uses: actions/checkout@v5
        with:
          # The committed scorecard cites its producer commit, normally the parent of the card
          # commit. Its provenance test must be able to read that object in CI and PR merge refs.
          fetch-depth: 0
      # uv is installed with pip rather than through astral-sh/setup-uv, for two reasons: the
      # action still targets Node 20 and so annotates every job with a deprecation warning,
      # and this removes a third-party action from the supply chain of a repository whose
      # whole subject is provenance. Pinned for the same reason ruff is.
      - name: Install uv
        run: |
          UV_BOOTSTRAP="$RUNNER_TEMP/artifactforge-uv-bootstrap"
          python3 -m venv "$UV_BOOTSTRAP"
          "$UV_BOOTSTRAP/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$UV_VERSION"
          echo "$UV_BOOTSTRAP/bin" >> "$GITHUB_PATH"
          "$UV_BOOTSTRAP/bin/uv" --version
      - name: Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install ArtifactForge + real-parser oracles
        run: |
          uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Oracle versions (fail fast if broken)
        # A silently-missing oracle turns a real gate into a skipped test, and a skipped test
        # exits 0. Print every external oracle's version and import both shipped raw readers
        # so a broken install fails here, loudly, rather than downstream as a green run that
        # checked nothing.
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import sqlite3
          import lief, macholib, pefile, pyregf, pyscca, regipy, windowsprefetch, yara
          from dissect.target import Target
          from elftools.elf.elffile import ELFFile
          from xdg.DesktopEntry import DesktopEntry
          from artifactforge.gates.oracles import (
              loads_bash_history,
              loads_binary_plist,
              loads_desktop_entry,
              loads_sqlite,
          )
          print("pefile          ", pefile.__version__)
          print("lief            ", lief.__version__)
          print("macholib        ", macholib.__version__)
          print("regipy          ", getattr(regipy, "__version__", "(unversioned)"))
          print("libregf         ", pyregf.get_version())
          print("windowsprefetch ", getattr(windowsprefetch, "__version__", "(unversioned)"))
          print("libscca         ", pyscca.get_version())
          print("yara-python     ", yara.__version__)
          print("pyelftools      ", importlib.metadata.version("pyelftools"))
          print("PyXDG           ", importlib.metadata.version("PyXDG"))
          print("dissect.target  ", importlib.metadata.version("dissect.target"))
          print("sqlite3         ", sqlite3.sqlite_version)
          print("Linux adapters  ", ELFFile.__name__, DesktopEntry.__name__, Target.__name__)
          print("shipped raw     ", loads_sqlite.__name__, loads_binary_plist.__name__,
                loads_desktop_entry.__name__, loads_bash_history.__name__)
          PY

      - name: Lint
        run: uv run ruff check .

      - name: Tests (real parsers over freshly generated artifacts)
        run: uv run pytest -q -rs

      - name: Fixture Core — build, reproduce, assure and release deterministically
        run: |
          uv run artifactforge fixture build \
            examples/fixtures/windows-loose-v1.json fixture-run/windows-a
          PYTHONHASHSEED=7 TZ=Asia/Tokyo LC_ALL=C uv run artifactforge fixture build \
            examples/fixtures/windows-loose-v1.json fixture-run/windows-b
          uv run artifactforge fixture verify fixture-run/windows-a --assurance
          uv run artifactforge fixture diff fixture-run/windows-a fixture-run/windows-b
          uv run artifactforge fixture release \
            fixture-run/windows-a fixture-run/windows-a.tar --assurance
          uv run artifactforge fixture release \
            fixture-run/windows-b fixture-run/windows-b.tar --assurance
          cmp fixture-run/windows-a.tar fixture-run/windows-b.tar
          uv run artifactforge fixture build \
            examples/fixtures/linux-glibc-x86_64-loose-v1.json fixture-run/linux-a
          PYTHONHASHSEED=7 TZ=Asia/Tokyo LC_ALL=C uv run artifactforge fixture build \
            examples/fixtures/linux-glibc-x86_64-loose-v1.json fixture-run/linux-b
          uv run artifactforge fixture verify fixture-run/linux-a --assurance
          uv run artifactforge fixture diff fixture-run/linux-a fixture-run/linux-b
          uv run artifactforge fixture release \
            fixture-run/linux-a fixture-run/linux-a.tar --assurance
          uv run artifactforge fixture release \
            fixture-run/linux-b fixture-run/linux-b.tar --assurance
          cmp fixture-run/linux-a.tar fixture-run/linux-b.tar
          echo "Windows and Linux fixture trees and release archives are byte-identical"

      - name: Distributions — constrained reproducible sdist, wheel and no-dependency smoke
        if: matrix.python-version == '3.12'
        run: |
          umask 022
          PYTHONHASHSEED=1 TZ=UTC LC_ALL=C uv build \
            --build-constraint build-constraints.txt --require-hashes \
            --out-dir "$RUNNER_TEMP/artifactforge-dist-a"
          umask 077
          PYTHONHASHSEED=7 TZ=Asia/Tokyo LC_ALL=C uv build \
            --build-constraint build-constraints.txt --require-hashes \
            --out-dir "$RUNNER_TEMP/artifactforge-dist-b"
          cmp "$RUNNER_TEMP"/artifactforge-dist-a/artifactforge-*.tar.gz \
            "$RUNNER_TEMP"/artifactforge-dist-b/artifactforge-*.tar.gz
          cmp "$RUNNER_TEMP"/artifactforge-dist-a/artifactforge-*.whl \
            "$RUNNER_TEMP"/artifactforge-dist-b/artifactforge-*.whl

          uv venv "$RUNNER_TEMP/artifactforge-wheel-smoke" \
            --python ${{ matrix.python-version }}
          uv pip install \
            --python "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/python" --no-deps \
            "$RUNNER_TEMP"/artifactforge-dist-a/artifactforge-*.whl
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture build \
            examples/fixtures/windows-loose-v1.json \
            "$RUNNER_TEMP/artifactforge-wheel-windows-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture verify \
            "$RUNNER_TEMP/artifactforge-wheel-windows-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture build \
            examples/fixtures/macos-14-loose-v1.json \
            "$RUNNER_TEMP/artifactforge-wheel-macos-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture verify \
            "$RUNNER_TEMP/artifactforge-wheel-macos-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture build \
            examples/fixtures/linux-glibc-x86_64-loose-v1.json \
            "$RUNNER_TEMP/artifactforge-wheel-linux-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/artifactforge" fixture verify \
            "$RUNNER_TEMP/artifactforge-wheel-linux-fixture"
          "$RUNNER_TEMP/artifactforge-wheel-smoke/bin/python" - <<'PY'
          from importlib.resources import files
          import os
          from pathlib import Path
          import tarfile
          import zipfile
          from artifactforge.gates.oracles import load_binary_plist, load_sqlite

          runner = Path(os.environ["RUNNER_TEMP"])
          dist = runner / "artifactforge-dist-a"
          wheel = next(dist.glob("artifactforge-*.whl"))
          sdist = next(dist.glob("artifactforge-*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_meta = next(name for name in archive.namelist()
                                if name.endswith(".dist-info/WHEEL"))
              metadata = archive.read(wheel_meta).decode("utf-8")
          assert "Generator: hatchling 1.31.0\n" in metadata
          with tarfile.open(sdist, "r:gz") as archive:
              members = archive.getnames()
          assert any(name.endswith("/build-constraints.in") for name in members)
          assert any(name.endswith("/build-constraints.txt") for name in members)

          names = sorted(path.name for path in files("artifactforge.fixture.schemas").iterdir())
          assert names == ["fixture-manifest-v1.schema.json", "fixture-spec-v1.schema.json"]
          payload = runner / "artifactforge-wheel-macos-fixture" / "artifacts"
          databases = [payload / name for name in ("knowledgeC.db", "TCC.db", "QuarantineEventsV2")]
          plists = sorted(payload.glob("*.plist"))
          assert all(load_sqlite(path).tables for path in databases)
          assert len(plists) == 3 and all(load_binary_plist(path) for path in plists)
          linux_payload = runner / "artifactforge-wheel-linux-fixture" / "artifacts"
          linux_files = sorted(path for path in linux_payload.rglob("*") if path.is_file())
          assert len(linux_files) == 9
          assert sum(path.read_bytes()[:4] == b"\x7fELF" for path in linux_files) == 5
          assert sum(path.suffix == ".desktop" for path in linux_files) == 3
          assert sum(path.name == ".bash_history" for path in linux_files) == 1
          print(names)
          PY

      # The keystone. Declared answer-bearing resident-file identities are re-derived from the
      # bytes on disk through real parsers and then compared. Deliberate stale/absent decoys
      # are outside this scope.
      - name: Gate 2 — identity (must PASS)
        run: uv run artifactforge gate identity --n 40

      # Every classified format has two implementations. SQLite, binary plists, XDG entries
      # and Bash history pair an external/standard parser with a bounded first-party reader;
      # ELF pairs LIEF with pyelftools. All pairs require typed consensus and exact profiles.
      - name: Gate 1 — validity (must PASS)
        run: uv run artifactforge gate validity --n 40

      # Checked on emitted bytes: PE, Mach-O and ELF follow format-specific instruction and
      # executable-region policies; classified structured formats carry their marker; and
      # indicators stay in reserved namespaces. Plain xattr sidecars are the marker exception.
      - name: Gate 3 — inertness (must PASS)
        run: uv run artifactforge gate inertness --n 40

      # The committed gallery must still be what the generator produces. A regeneration that
      # differs is a change in the generator, and should be reviewed as one rather than
      # discovered by a reader.
      #
      # SQLite files are excluded, and only those. A SQLite header embeds the version of the
      # library that wrote it, so knowledgeC / TCC / QuarantineEventsV2 differ between the
      # runner's sqlite3 and whichever built the committed copies — KNOWN_TELLS.md has said so
      # from the start, and a step asserting the opposite would be asserting something the
      # project documents as untrue. Everything else must match to the byte, across operating
      # system and architecture: the gallery was built on macOS/arm64 and this runs on
      # Linux/x86-64.
      - name: Samples — regenerate and byte-diff against what is committed
        run: |
          cp -r samples samples.committed
          PY=.venv/bin/python AF=.venv/bin/artifactforge ./scripts/make-samples.sh
          diff -r -x 'knowledgeC.db' -x 'TCC.db' -x 'QuarantineEventsV2' \
            samples.committed samples
          echo "every non-SQLite artifact is byte-identical across OS and architecture"
          # The excluded three still have to satisfy both implementations, or the exclusion
          # would hide a break.
          for db in knowledgeC.db TCC.db QuarantineEventsV2; do
            uv run python -c "
          import sqlite3, sys
          from artifactforge.gates.oracles import load_sqlite
          con = sqlite3.connect('samples/02-macos-quarantined-app/$db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert con.execute(\"SELECT count(*) FROM sqlite_master WHERE type='table'\").fetchone()[0] >= 2
          assert load_sqlite('samples/02-macos-quarantined-app/$db').tables
          print('  $db ok')"
          done

      - name: Demo — the whole loop end to end
        run: AF=.venv/bin/artifactforge ./scripts/demo.sh

      # Gate 4's CI assertion is the deterministic, source-bound scorecard-measurement corpus.
      # --n must match its committed provenance. This verifies that no registered shortcut is
      # detected at the declared familywise alpha; complete attacks and composition ensembles
      # have independent calibrations. It is a non-reportable control, not universal shortcut
      # resistance or a performance score.
      # CI deliberately does not require a freshly random-keyed holdout to stay green: the
      # declared test permits a Type-I rejection, so that outcome cannot be a deterministic
      # build invariant.
      - name: Gate 4 — solvability (source-bound deterministic scorecard check)
        run: uv run artifactforge scorecard --n 40 --check fidelity-scorecard.json

      - name: Determinism — regenerate and byte-diff
        # The property everything else rests on: the same seed must produce the same bytes.
        # Generated twice into separate trees under a different PYTHONHASHSEED, TZ and locale.
        run: |
          # Benchmark publication intentionally requires a caller-owned, already-existing
          # real parent directory. Keep that fail-closed boundary and satisfy it explicitly.
          mkdir -p out
          uv run artifactforge bench new out/a --n 8 --kind dev
          PYTHONHASHSEED=7 TZ=Asia/Tokyo LC_ALL=C uv run artifactforge bench new out/b --n 8 --kind dev
          diff -r out/a/scenarios out/b/scenarios
          diff -r out/a/_answers out/b/_answers
          echo "byte-identical across runs"

  # Linux exercises the byte-level verifier on every supported Python. This native lane asks
  # Apple's own tools the narrower questions only macOS can answer and retains their responses
  # as JSON. A non-zero spctl result is called a rejection only when the platform positive
  # control passes; an unavailable assessment service is recorded as inconclusive instead.
  macos-native:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Native tools (missing means FAIL)
        run: |
          for tool in codesign plutil spctl what xattr; do
            command -v "$tool"
          done
          sw_vers
          uname -m

      - name: Install uv and ArtifactForge
        run: |
          UV_BOOTSTRAP="$RUNNER_TEMP/artifactforge-uv-bootstrap"
          python3 -m venv "$UV_BOOTSTRAP"
          "$UV_BOOTSTRAP/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$UV_VERSION"
          echo "$UV_BOOTSTRAP/bin" >> "$GITHUB_PATH"
          "$UV_BOOTSTRAP/bin/uv" --version
          "$UV_BOOTSTRAP/bin/uv" python install 3.12
          "$UV_BOOTSTRAP/bin/uv" sync --frozen --extra dev --python 3.12

      - name: Structural Mach-O safety mutations
        run: |
          uv run pytest -q -rs tests/test_macho.py tests/test_native_macos_attestation.py
          uv run pytest -q -rs tests/test_gate_mutations.py -k macho

      - name: Gate 3 over the five committed Mach-O binaries
        run: >-
          uv run artifactforge gate inertness
          --scene samples/02-macos-quarantined-app

      - name: Apple codesign, plutil and Gatekeeper attestation
        run: |
          uv run python scripts/attest_macos_native.py \
            --scene samples/02-macos-quarantined-app \
            --out native-macos-attestation.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("native-macos-attestation.json")
          raw = path.read_bytes()
          report = json.loads(raw)
          canonical = (json.dumps(
              report,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ) + "\n").encode()
          assert raw == canonical
          assert report["schema"] == "artifactforge-native-macos-attestation-v2"
          assert report["schema_version"] == 2
          assert report["generated_at_utc"].endswith("Z")
          assert report["verdict"] == "pass", report["failures"]
          source = report["producer"]["source"]
          assert source["worktree_clean"] is True
          assert len(source["git_commit"]) == 40
          assert len(source["git_tree"]) == 40
          assert report["producer"]["source_post_attestation"]["unchanged"] is True
          assert report["producer"]["github_run"]["git_sha"] == source["git_commit"]
          assert report["platform"]["product_version"]["stdout"]
          assert report["platform"]["build_version"]["stdout"]
          scene = report["scene"]
          assert not Path(scene["path"]).is_absolute()
          assert scene["manifest"]["file_count"] == len(scene["manifest"]["files"])
          assert scene["post_attestation"]["tree_sha256"] == scene["manifest"]["tree_sha256"]
          assert scene["post_attestation"]["unchanged"] is True
          validation_tools = report["tools"]["validation_tools"]
          assert sorted(validation_tools) == ["codesign", "plutil", "spctl", "xattr"]
          for evidence in validation_tools.values():
              assert len(evidence["sha256"]) == 64
              assert evidence["size"] > 0
              assert evidence["version_evidence"]["apple_build_markers"]
          assert len(report["code_signatures"]) == 5
          assert len(report["property_lists"]) == 3
          assert len(report["gatekeeper"]["assessments"]) == 10
          assert not any(a["conclusion"] == "accepted_unexpectedly"
                         for a in report["gatekeeper"]["assessments"])
          print(report["gatekeeper"]["verdict"])
          PY

      - name: Retain native attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-attestation
          path: native-macos-attestation.json
          if-no-files-found: ignore

  # The fixture-bound attestation runs canonical/reproduction verification plus portable Gates
  # 1 and 3 in-process, then adds complementary native Linux observations on a pinned
  # Ubuntu/amd64 runner. It retains the exact bound reports and every native response as
  # canonical JSON. Nothing executes an emitted ELF, invokes ldd, launches an XDG entry, or
  # sources/evaluates Bash history. The history control proves both non-execution and that the
  # positive-control sentinel is observable.
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Native tools and package evidence (missing means FAIL)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash binutils desktop-file-utils file
          test "$(uname -m)" = x86_64
          for tool in readelf objdump file desktop-file-validate bash dpkg-query uname; do
            command -v "$tool"
          done
          readelf --version
          objdump --version
          file --version
          bash --version
          dpkg-query --show --showformat='${binary:Package}\t${Version}\t${Architecture}\n' \
            bash binutils desktop-file-utils file

      - name: Install uv and ArtifactForge
        run: |
          UV_BOOTSTRAP="$RUNNER_TEMP/artifactforge-uv-bootstrap"
          python3 -m venv "$UV_BOOTSTRAP"
          "$UV_BOOTSTRAP/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$UV_VERSION"
          echo "$UV_BOOTSTRAP/bin" >> "$GITHUB_PATH"
          "$UV_BOOTSTRAP/bin/uv" --version
          "$UV_BOOTSTRAP/bin/uv" python install 3.12
          "$UV_BOOTSTRAP/bin/uv" sync --frozen --extra dev --python 3.12

      - name: Native-lane contract and Linux safety mutations
        run: |
          uv run pytest -q -rs \
            tests/test_native_linux_attestation.py \
            tests/test_elf.py \
            tests/test_linux_artifacts.py

      - name: Generate the exact Linux Fixture Core root
        run: |
          uv run artifactforge fixture build \
            examples/fixtures/linux-glibc-x86_64-loose-v1.json \
            "$RUNNER_TEMP/artifactforge-linux-native/fixture"

      - name: Fixture-bound portable assurance plus complementary native attestation
        run: |
          uv run python scripts/attest_linux_native.py \
            --fixture "$RUNNER_TEMP/artifactforge-linux-native/fixture" \
            --out "$RUNNER_TEMP/native-linux-attestation.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "native-linux-attestation.json"
          raw = path.read_bytes()
          report = json.loads(raw)
          canonical = (json.dumps(
              report,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ) + "\n").encode()
          assert raw == canonical
          assert report["schema"] == "artifactforge-native-linux-attestation-v2"
          assert report["schema_version"] == 2
          assert report["generated_at_utc"].endswith("Z")
          assert report["verdict"] == "pass", report["failures"]
          source = report["producer"]["source"]
          assert source["worktree_clean"] is True
          assert len(source["git_commit"]) == 40
          assert len(source["git_tree"]) == 40
          assert report["producer"]["source_post_attestation"]["unchanged"] is True
          assert report["producer"]["github_run"]["git_sha"] == source["git_commit"]
          platform = report["platform"]
          assert platform["system"] == "Linux"
          assert platform["machine"].lower() in {"amd64", "x86_64"}
          assert platform["os_release"]["fields"]["ID"] == "ubuntu"
          assert platform["os_release"]["fields"]["VERSION_ID"] == "24.04"
          packages = {row["package"].split(":", 1)[0]
                      for row in platform["package_database"]["packages"]}
          assert {"bash", "binutils", "desktop-file-utils", "file"} <= packages
          fixture = report["fixture"]
          assert not Path(fixture["path"]).is_absolute()
          assert len(fixture["manifest_file"]["sha256"]) == 64
          manifest = fixture["manifest"]
          assert manifest["generator"]["name"] == "artifactforge"
          assert manifest["generator"]["abi"] == "artifactforge-fixture-generator-v1"
          assert manifest["recipe"]["family"] == "linux"
          assert manifest["recipe"]["profile"]["id"] == \
              "linux-glibc-x86_64-loose-v1"
          assert manifest["payload"]["file_count"] == 9
          portable = fixture["portable_verification"]
          assert portable["verdict"] == "pass"
          assert portable["failures"] == []
          environment = portable["environment"]
          assert environment["python"]["implementation"] == "CPython"
          assert environment["python"]["version"]
          assert set(environment["distributions"]) == {
              "PyXDG", "artifactforge", "dissect.target", "lief", "pyelftools",
          }
          assert environment["distributions"]["artifactforge"] == \
              manifest["generator"]["version"]
          assert all(environment["distributions"].values())
          assert [(item["gate"], item["name"], item["verdict"])
                  for item in portable["reports"]] == [
              (1, "validity", "pass"),
              (3, "inertness", "pass"),
          ]
          assert fixture["post_attestation"]["unchanged"] is True
          assert fixture["post_attestation"]["manifest_file"]["unchanged"] is True
          scene = report["scene"]
          assert not Path(scene["path"]).is_absolute()
          assert scene["manifest"]["file_count"] == 9
          assert scene["post_attestation"]["tree_sha256"] == scene["manifest"]["tree_sha256"]
          assert scene["post_attestation"]["unchanged"] is True
          assert scene["observed_profile"] == {
              "desktop_entries": 3,
              "elf_files": 5,
              "history_files": 1,
              "total_files": 9,
              "unknown_files": 0,
              "users": ["v"],
          }
          tools = report["tools"]["validation_tools"]
          assert sorted(tools) == [
              "bash", "desktop-file-validate", "file", "objdump", "readelf"
          ]
          for evidence in tools.values():
              assert len(evidence["sha256"]) == 64
              assert evidence["size"] > 0
              assert evidence["version"]["returncode"] == 0
              assert evidence["version"]["stdout"]
          tool_post = report["tools"]["post_attestation"]
          assert tool_post["unchanged"] is True
          assert sorted(tool_post["tools"]) == [
              "bash", "desktop-file-validate", "dpkg-query", "file", "objdump",
              "readelf", "uname",
          ]
          assert all(item["unchanged"] for item in tool_post["tools"].values())
          assert len(report["artifacts"]["elf_files"]) == 5
          assert len(report["artifacts"]["desktop_entries"]) == 3
          assert len(report["artifacts"]["bash_history"]) == 1
          history = report["artifacts"]["bash_history"][0]
          assert history["byte_identical_roundtrip"] is True
          assert history["nonexecution_control"]["control_roundtrip_byte_identical"] is True
          assert (history["nonexecution_control"]["control_roundtrip_sha256"] ==
                  history["nonexecution_control"]["control_history_sha256"])
          assert history["nonexecution_control"]["history_command_was_not_executed"] is True
          assert history["nonexecution_control"]["positive_control_observed"] is True
          expected = [
              {"address": "0x1000", "bytes": "31ff", "instruction": "xor %edi,%edi"},
              {"address": "0x1002", "bytes": "b83c000000", "instruction": "mov $0x3c,%eax"},
              {"address": "0x1007", "bytes": "0f05", "instruction": "syscall"},
          ]
          assert all(item["disassembly"] == expected
                     for item in report["artifacts"]["elf_files"])
          PY

      - name: Retain native attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-attestation
          path: ${{ runner.temp }}/native-linux-attestation.json
          if-no-files-found: ignore

  # EvidenceForge is a CI-only development tool, never a declared dependency: it is not on
  # PyPI, so naming it would force a git URL into the metadata and hatchling refuses to build
  # a wheel for a project carrying one.
  #
  # This job proves the transcribed seed formulas still match upstream's own code and that a
  # real run still recovers cleanly. It generates its own run and HARD FAILS if EvidenceForge
  # is missing or if any contract test skips — a skipped integration test exits 0 and reads
  # exactly like a passing one, which is how a formula change would sail through green.
  ef-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # uv is installed with pip rather than through astral-sh/setup-uv, for two reasons: the
      # action still targets Node 20 and so annotates every job with a deprecation warning,
      # and this removes a third-party action from the supply chain of a repository whose
      # whole subject is provenance. Pinned for the same reason ruff is.
      - name: Install uv
        run: |
          UV_BOOTSTRAP="$RUNNER_TEMP/artifactforge-uv-bootstrap"
          python3 -m venv "$UV_BOOTSTRAP"
          "$UV_BOOTSTRAP/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$UV_VERSION"
          echo "$UV_BOOTSTRAP/bin" >> "$GITHUB_PATH"
          "$UV_BOOTSTRAP/bin/uv" --version
      - name: Python
        run: uv python install 3.12.13

      - name: Install ArtifactForge + EvidenceForge (pinned)
        # The distribution is `evidence-forge`; the import name is `evidenceforge`. Naming the
        # import here makes uv exit 1 with "Package metadata name does not match given name" —
        # which is what stopped this workflow from ever reaching pytest.
        run: |
          uv sync --frozen --extra dev --python 3.12.13
          uv pip install \
            --constraint integration/evidenceforge/constraints-v1.13.1.txt \
            "evidence-forge @ git+https://github.com/Cisco-Talos/EvidenceForge@${{ env.EF_TAG }}"

      - name: EvidenceForge version (fail fast if broken)
        run: uv run python -c "import evidenceforge; print(evidenceforge.__file__)"

      - name: Generate a real EvidenceForge run
        # The scenario is not shipped in the wheel, so fetch it from the same pinned tag.
        run: |
          curl -fsSL -o scenario.yaml \
            "https://raw.githubusercontent.com/Cisco-Talos/EvidenceForge/${{ env.EF_TAG }}/scenarios/branch-office-example/scenario.yaml"
          uv run python -m evidenceforge generate scenario.yaml -o ef-out
          test -f ef-out/GROUND_TRUTH.json
          uv run python -m evidenceforge generate \
            integration/evidenceforge/scenarios/content-identity-witness-v1.13.1.yaml \
            -o ef-witness-out
          test -f ef-witness-out/GROUND_TRUTH.json

      - name: Verify pinned EvidenceForge measurement
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import json
          import subprocess
          import sys

          distribution = importlib.metadata.distribution("evidence-forge")
          direct_url = json.loads(distribution.read_text("direct_url.json"))
          subprocess.run(
              [
                  sys.executable,
                  "scripts/measure_evidenceforge.py",
                  "measure",
                  "ef-out",
                  "--scenario",
                  "scenario.yaml",
                  "--evidenceforge-version",
                  distribution.version,
                  "--evidenceforge-commit",
                  direct_url["vcs_info"]["commit_id"],
                  "--output",
                  "ef-measurement.json",
              ],
              check=True,
          )
          PY
          diff -u measurements/evidenceforge-v1.13.1-branch-office-example.json ef-measurement.json
          uv run python scripts/measure_evidenceforge.py check \
            measurements/evidenceforge-v1.13.1-branch-office-example.json \
            --run-root ef-out

      - name: Verify controlled content-identity witness
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import json
          import platform
          import subprocess
          import sys

          distribution = importlib.metadata.distribution("evidence-forge")
          direct_url = json.loads(distribution.read_text("direct_url.json"))
          subprocess.run(
              [
                  sys.executable,
                  "scripts/measure_evidenceforge_witness.py",
                  "measure",
                  "ef-witness-out",
                  "--scenario",
                  "integration/evidenceforge/scenarios/"
                  "content-identity-witness-v1.13.1.yaml",
                  "--evidenceforge-version",
                  distribution.version,
                  "--evidenceforge-commit",
                  direct_url["vcs_info"]["commit_id"],
                  "--python-version",
                  platform.python_version(),
                  "--output",
                  "ef-witness-measurement.json",
              ],
              check=True,
          )
          PY
          diff -u \
            measurements/evidenceforge-v1.13.1-controlled-content-identity.json \
            ef-witness-measurement.json
          uv run python scripts/measure_evidenceforge_witness.py check \
            measurements/evidenceforge-v1.13.1-controlled-content-identity.json \
            --run-root ef-witness-out

      - name: Contract — must RUN, not skip
        env:
          ARTIFACTFORGE_EF_OUT: ef-out
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/ef_contract/ | tee ef.log
          if grep -qi 'skipped' ef.log; then
            echo "an EvidenceForge contract test SKIPPED — a skip here is a silent pass" >&2
            exit 1
          fi

  # A canary, not a gate. Runs the same contract against upstream's default branch so that a
  # seed-formula change shows up here as a warning rather than as a surprise on the day the
  # pin is bumped.
  ef-drift-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      # uv is installed with pip rather than through astral-sh/setup-uv, for two reasons: the
      # action still targets Node 20 and so annotates every job with a deprecation warning,
      # and this removes a third-party action from the supply chain of a repository whose
      # whole subject is provenance. Pinned for the same reason ruff is.
      - name: Install uv
        run: |
          UV_BOOTSTRAP="$RUNNER_TEMP/artifactforge-uv-bootstrap"
          python3 -m venv "$UV_BOOTSTRAP"
          "$UV_BOOTSTRAP/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$UV_VERSION"
          echo "$UV_BOOTSTRAP/bin" >> "$GITHUB_PATH"
          "$UV_BOOTSTRAP/bin/uv" --version
      - run: uv python install 3.12
      - name: Install against EvidenceForge main
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv pip install "evidence-forge @ git+https://github.com/Cisco-Talos/EvidenceForge@main"
      - name: Golden formulas against main
        run: uv run pytest -q tests/ef_contract/test_golden_formulas.py
